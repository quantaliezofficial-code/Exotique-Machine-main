<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The backend replaces everything between these markers per page (title, description,
         canonical, Open Graph, JSON-LD). Keep the markers. -->
    <!--seo:start-->
    <title>Exotique Machines | Certified Pre-Owned Luxury Cars in Lucknow</title>
    <meta name="description" content="Certified pre-owned luxury cars in Lucknow: BMW, Mercedes-Benz, Audi, Land Rover, Toyota and more, with finance, trade-in and test drives at Exotique Machines." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-default.jpg" />
    <!--seo:end-->
    <meta name="theme-color" content="#fafaf9" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM summary" />
    <style>
      /* Server-rendered content snapshot (crawlers, no-JS visitors, first paint before the
         app mounts). React replaces it. */
      .seo-snapshot { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1917; max-width: 72rem; margin: 0 auto; padding: 1rem; line-height: 1.55; }
      .seo-snapshot nav ul { display: flex; flex-wrap: wrap; gap: .25rem 1rem; list-style: none; padding: 0; margin: 0 0 1.5rem; font-size: .875rem; }
      .seo-snapshot a { color: #92400e; }
      .seo-snapshot h1 { font-size: 1.75rem; line-height: 1.2; margin: .5rem 0 1rem; }
      .seo-snapshot h2 { font-size: 1.25rem; margin: 1.75rem 0 .5rem; }
      .seo-snapshot img { max-width: 100%; height: auto; }
      .seo-snapshot dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
      .seo-snapshot dd { margin: 0; }
      .seo-snapshot footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e7e5e4; font-size: .875rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:1rem;font-family:system-ui">This site works best with JavaScript enabled. You can still call the showroom or browse the cars listed above.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
