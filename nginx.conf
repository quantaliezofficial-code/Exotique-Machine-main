# Frontend container (exotique-frontend). The host's reverse proxy terminates TLS and
# forwards to 127.0.0.1:3001 → this server.
#
# Request flow
#   /assets/*            hashed Vite bundles, served here (1 year, immutable)
#   static files         served here (logo, fonts, og image…)
#   /api/*  /uploads/*   proxied to FastAPI
#   /media/*             optimised image variants from FastAPI (1 year, immutable)
#   sitemap/robots/llms  generated by FastAPI from the database
#   every other GET      HTML page: FastAPI renders head tags + content snapshot into the
#                        SPA shell (/__seo/<path>). If the backend is down, the plain SPA
#                        shell is served so the site still loads.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Docker's embedded DNS: resolve the backend at request time, so nginx starts even if the
# backend container is restarting.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    set $backend http://exotique-backend:5000;

    # Canonical host: www → apex
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    client_max_body_size 320m;   # 20 photos (25 MB each) or one video (300 MB) per upload
    proxy_read_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/ld+json;

    include /etc/nginx/snippets/security-headers.conf;

    # ------------------------------------------------------------ static
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Videos that ship with the site (public/videos/). Names carry a content hash.
    # nginx serves byte ranges itself, so seeking works and phones fetch only what they play.
    location ^~ /videos/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri @render;
    }

    # The raw shell for the backend renderer (public anyway: it is the SPA's index.html).
    location ^~ /_shell/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html { return 301 /; }

    # ------------------------------------------------------------ backend
    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-page.conf;
        proxy_read_timeout 300s;          # large photo uploads
        proxy_request_buffering on;
        proxy_pass $backend;
    }

    # User-uploaded images keep the backend's sandbox CSP and immutable caching.
    location ^~ /uploads/ {
        include /etc/nginx/snippets/proxy.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=2592000" always;   # file names are unique per upload
        proxy_pass $backend;
    }

    location ^~ /media/ {
        include /etc/nginx/snippets/proxy.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_read_timeout 120s;          # first request may encode the variant
        proxy_pass $backend;
    }

    # sitemap/robots/llms, plus the IndexNow key file (/<key>.txt, 404 unless configured)
    location ~ "^/(sitemap\.xml|robots\.txt|llms\.txt|[A-Za-z0-9-]{8,128}\.txt)$" {
        include /etc/nginx/snippets/proxy-page.conf;
        proxy_pass $backend;
    }

    # Internal endpoints are never reachable from outside.
    location ~ ^/(__seo|docs|redoc|openapi\.json)(/|$) { return 404; }

    # ------------------------------------------------------------ pages
    location / {
        try_files $uri @render;
    }

    location @render {
        include /etc/nginx/snippets/proxy-page.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
        rewrite ^ /__seo$uri break;
        proxy_pass $backend;
    }

    location @spa {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_shell/index.html =503;
    }
}
